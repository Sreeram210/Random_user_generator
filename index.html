<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random User Generator</title>
    <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    
    <div class="container mt-4">
        <h1 class="text-center">Random User Generator</h1>
        <div class="d-flex justify-content-center mt-3">
            <input id="count" class="form-control w-25 me-2" type="number" min="1" max="20" value="1" placeholder="How many users?">
            <button class="btn btn-primary" onclick="getUsers()">Generate</button>
        </div>
        <div id="result" class="row mt-4">

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
